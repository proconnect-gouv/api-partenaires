networks:
  default:
    ipam:
      config:
        # fixed subnet so the gateway (host connections) is deterministically 172.28.0.1
        - subnet: 172.28.0.0/24

services:
  mongo:
    image: mongo:8.2.11
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 1s
      timeout: 2s
      retries: 10

  partners:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongo:27017/partners
      # the gateway IP: requests from the host, as observed by the proxy
      - AUTHORIZED_IPS=172.28.0.1
      - PARTNERS_CONFIG_FILE=/etc/partners/partners.yaml
    volumes:
      - ./partners.yaml:/etc/partners/partners.yaml:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/readyz || exit 1",
        ]
      interval: 1s
      timeout: 1s
      retries: 10

  proxy:
    image: nginx:1.31.2-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      partners:
        condition: service_healthy

  attacker:
    image: curlimages/curl:8.21.0
    networks:
      default:
        # any address other than the allowlisted gateway
        ipv4_address: 172.28.0.66
    entrypoint: ["sleep", "infinity"]
