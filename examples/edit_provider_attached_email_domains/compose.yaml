services:
  mongo:
    extends:
      file: ../compose.yaml
      service: mongo
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d:ro

  partners:
    extends:
      file: ../compose.yaml
      service: partners
    environment:
      OIDC_PROVIDERS_CONFIG: /etc/oidc_providers/oidc_providers.yaml
      RATE_LIMIT_PER_MINUTE_PER_OIDC_PROVIDER: 100
    volumes:
      - ./oidc_providers.yaml:/etc/oidc_providers/oidc_providers.yaml:ro
