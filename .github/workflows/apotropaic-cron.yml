name: 🛡️ Apotropaic Cron

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

jobs:
  lint-apotropaic:
    runs-on: ubuntu-latest
    name: 🛡️ Lint allowlist

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🗓️ Today's date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: 🗓️ Cache DILA export
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/proconnect-allowlist
          key: dila-export-${{ steps.date.outputs.today }}

      - name: 🛡️ Lint allowlist
        run: |
          bun -e 'const { load_dila_export } = await import("#src/apotropaic/dila"); await load_dila_export();'
          bun run lint:apotropaic
