name: 🛡️ Apotropaic Cron

on:
  pull_request:
    paths:
      - .github/workflows/apotropaic-cron.yml
      - src/allowlist/**
      - src/validation/**
  push:
    branches: [main]
    paths:
      - .github/workflows/apotropaic-cron.yml
      - src/allowlist/**
      - src/validation/**
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FIX_BRANCH: apotropaic/drop-refused-${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  LABEL: 🛡️ cron
  REF: ${{ github.head_ref || github.ref_name }}
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TEAM: "@proconnect-gouv/developers"

jobs:
  lint-apotropaic:
    runs-on: ubuntu-latest
    name: 🛡️ Lint allowlist

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🗓️ Cache DILA export
        uses: ./.github/actions/dila-cache

      - name: 🛡️ Lint allowlist
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          bun run lint:apotropaic --refused "$RUNNER_TEMP/refused.json" 2>&1 \
            | tee "$RUNNER_TEMP/lint.log"

      - name: 🔧 Repoint or drop refused rows
        id: fix
        if: steps.lint.outcome == 'failure'
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/refused.json" ] && [ "$(jq length "$RUNNER_TEMP/refused.json")" -gt 0 ] || exit 1
          jq -r 'map(.domain) | unique | .[]' "$RUNNER_TEMP/refused.json" \
            | xargs bun run explain:domain > "$RUNNER_TEMP/explain.log" 2>&1 || true
          bun run src/validation/bin/fix_refused.ts "$RUNNER_TEMP/refused.json"
          bun run lint:apotropaic > "$RUNNER_TEMP/relint.log" 2>&1

      - name: 📝 Render report
        run: |
          bun run src/validation/bin/cron_report.ts --out "$RUNNER_TEMP/report" \
            --lint-log "$RUNNER_TEMP/lint.log" --refused "$RUNNER_TEMP/refused.json" \
            --explain "$RUNNER_TEMP/explain.log"

      - name: 📝 Summarize fix
        if: steps.fix.outcome == 'success'
        run: |
          {
            cat "$RUNNER_TEMP/report/summary.md"
            echo
            echo '```diff'
            git diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📬 Open or update fix pull request
        id: pr
        if: steps.fix.outcome == 'success' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          config=config/anct/oidc_providers.production.yaml
          changeset=".release-it-changeset/$(date -u +%F)-drop-refused.md"
          report="$RUNNER_TEMP/report"
          scratch="apotropaic/blob-$GITHUB_RUN_ID"
          title=$(cat "$report/title.txt")
          mkdir -p .release-it-changeset
          cp "$report/changeset.md" "$changeset"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$changeset"
          git commit -q -m "$title" -- "$config" "$changeset"
          git push -q origin "HEAD:refs/heads/$scratch"
          trap 'gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$scratch" || true' EXIT
          commit=$(jq -n --rawfile message "$report/message.txt" --arg parent "$SHA" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
              '{message: $message, parents: [$parent], tree: $tree}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$FIX_BRANCH" -f sha="$commit" -F force=true \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$FIX_BRANCH" -f sha="$commit"
          number=$(gh pr list --head "$FIX_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$report/pr.md"
          else
            gh label create "$LABEL" --color B60205 --force
            gh pr create --base "$REF" --head "$FIX_BRANCH" --label "$LABEL" \
              --title "$title" --body-file "$report/pr.md"
            number=$(gh pr list --head "$FIX_BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "pull-request-url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number" >> "$GITHUB_OUTPUT"

      - name: 🚨 Open or update alert issue
        if: steps.lint.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          report="$RUNNER_TEMP/report"
          bun run src/validation/bin/cron_report.ts --out "$report" \
            --lint-log "$RUNNER_TEMP/lint.log" --refused "$RUNNER_TEMP/refused.json" \
            --explain "$RUNNER_TEMP/explain.log" --pr-url "$PR_URL"
          signature=$(cat "$report/signature.txt")
          gh label create "$LABEL" --color B60205 --force
          number=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --label "$LABEL" --title "🚨 Apotropaic cron failing" \
              --body-file "$report/issue.md"
            exit 0
          fi
          last=$(gh issue view "$number" --json body,comments \
            --jq '[.body, .comments[].body] | map(capture("<!-- signature: (?<s>[0-9a-f]+) -->").s? // empty) | last // empty')
          if [ "$last" != "$signature" ]; then
            gh issue comment "$number" --body-file "$report/issue.md"
          fi

      - name: ✅ Close alert issue
        if: steps.lint.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          for number in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "$(cat "$RUNNER_TEMP/report/closed.md")"
          done

      - name: 🚨 Fail on lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1
