name: 🗂️ Config Lint

on:
  push:
    branches: [main]
    paths:
      [
        "config/**",
        "src/apotropaic/**",
        "scripts/apotropaic.ts",
        "scripts/lint_config.ts",
        ".github/workflows/config-lint.yml",
      ]
  pull_request:
    branches: [main]
    paths:
      [
        "config/**",
        "src/apotropaic/**",
        "scripts/apotropaic.ts",
        "scripts/lint_config.ts",
        ".github/workflows/config-lint.yml",
      ]

permissions:
  contents: read

jobs:
  lint-config:
    runs-on: ubuntu-latest
    name: 🗂️ Lint config

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🗂️ Lint config files
        run: bun run lint:config

  lint-apotropaic:
    runs-on: ubuntu-latest
    name: 🛡️ Lint allowlist

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🗓️ Cache DILA export
        uses: ./.github/actions/dila-cache

      - name: 📥 Fetch base config
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:config/anct/oidc_providers.production.yaml" > "$RUNNER_TEMP/base.yaml"

      - name: 🛡️ Lint allowlist
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bun run lint:apotropaic --base-config "$RUNNER_TEMP/base.yaml" \
              --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
              --digest "$RUNNER_TEMP/digest.json"
          else
            bun run lint:apotropaic
          fi

      - name: 📤 Upload digest
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: apotropaic-digest
          path: ${{ runner.temp }}/digest.json
          retention-days: 7
