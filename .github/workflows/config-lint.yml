name: 🗂️ Config Lint

on:
  push:
    branches: [main]
    paths: ["config/**"]
  pull_request:
    branches: [main]
    paths: ["config/**"]

jobs:
  lint-config:
    runs-on: ubuntu-latest
    name: 🗂️ Lint config

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🗂️ Lint config files
        run: bun run lint:config
