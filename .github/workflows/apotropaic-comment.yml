name: 💬 Apotropaic Digest

on:
  workflow_run:
    workflows: ["🗂️ Config Lint"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    name: 💬 Post digest

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📥 Download digest
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: apotropaic-digest
          path: ${{ runner.temp }}/digest
          run-id: ${{ github.event.workflow_run.id }}

      - name: 🔎 Find pull request
        id: pr
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          numbers=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$HEAD_SHA" --json number,headRefOid \
            --jq "map(select(.headRefOid == \"$HEAD_SHA\")) | .[].number")
          if [ "$(printf '%s\n' "$numbers" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one open pull request at $HEAD_SHA, got: $numbers"
            exit 1
          fi
          echo "number=$numbers" >> "$GITHUB_OUTPUT"

      - name: 📝 Render comment
        if: steps.download.outcome == 'success'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          bun run scripts/apotropaic_comment.ts "$RUNNER_TEMP/digest/digest.json" \
            "$HEAD_SHA" "$RUN_URL" > "$RUNNER_TEMP/body.md"

      - name: 💬 Post or update comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- apotropaic-digest -->"))) | .id' \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          else
            gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
