name: 🚢 Release It !

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    name: 🔎 Select mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔎 Select mode
        id: select-mode
        uses: proconnect-gouv/release-action/select-mode@ae4edad3731ebb46ec9d37e314a26dc8ab6d2653 # v1.2.0

  version:
    name: 📝 Open release PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 📝 Version
        uses: proconnect-gouv/release-action/version@ae4edad3731ebb46ec9d37e314a26dc8ab6d2653 # v1.2.0

  publish:
    name: 🚀 Publish
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🚀 Publish
        id: publish
        uses: proconnect-gouv/release-action/publish@ae4edad3731ebb46ec9d37e314a26dc8ab6d2653 # v1.2.0
      - name: 🐳 Build Docker image
        if: steps.publish.outputs.published == 'true'
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.publish.outputs.version }}
